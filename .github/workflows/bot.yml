name: dpl-flow-bot

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '留空=正常运行, demo=发送图文范例'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install matplotlib

      - name: run bot
        env:
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py ${{ github.event.inputs.mode }}

      - name: publish feed
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -n "$GIST_TOKEN" ] && [ -f feed.json ]; then
          python -c "
          import json, os, urllib.request
          body = json.dumps({'files': {'feed.json': {'content': open('feed.json').read()}}}).encode()
          req = urllib.request.Request('https://api.github.com/gists/5a3e2e85c7c6fd01eeb2f73a6e72b9fd', data=body, method='PATCH', headers={'Authorization': 'Bearer ' + os.environ['GIST_TOKEN'], 'Accept': 'application/vnd.github+json'})
          print('feed gist:', urllib.request.urlopen(req).status)
          "
          fi

      - name: commit state
        run: |
          git config user.name "dpl-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "state update"
          git push
